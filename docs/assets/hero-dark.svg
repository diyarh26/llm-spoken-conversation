<title id="t">Who&#x27;s listening?</title>
<desc id="d">Timelines of turns for one topic. The human call alternates long turns with many tiny listener turns; LLM conversations have no listener turns, and the two-agent versions use far longer turns.</desc>
<text x="40.0" y="58.0" font-size="30" font-weight="700" fill="#e6edf3" text-anchor="start">Human phone calls are full of listening. LLM calls aren&#x27;t.</text>
<text x="40.0" y="92.0" font-size="17" font-weight="400" fill="#9198a1" text-anchor="start">One topic (recycling) as a timeline of turns: the first 300 words of a real call and of four LLM-generated versions.</text>
<text x="975.0" y="142.0" font-size="14" font-weight="600" fill="#6e7681" text-anchor="middle">words / turn</text>
<text x="1110.0" y="142.0" font-size="14" font-weight="600" fill="#6e7681" text-anchor="middle">listener turns</text>
<text x="40.0" y="187.0" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start">Humans</text>
<text x="40.0" y="206.0" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">real call (Switchboard)</text>
