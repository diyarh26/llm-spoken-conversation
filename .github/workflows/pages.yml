name: Explorer

# Builds the conversation explorer's data bundle from data/generated and deploys explorer/
# to GitHub Pages: https://diyarh26.github.io/llm-spoken-conversation/
on:
  push:
    branches: [main]
    paths:
      - "explorer/**"
      - "data/generated/**"
      - "results/**"
      - "analysis/analyze.py"
      - "analysis/figures.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the data bundle (standard library only)
        run: python explorer/build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: explorer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
